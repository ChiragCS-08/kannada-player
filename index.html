<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Playing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0d0d0d url("background.png?v=2") center center / cover no-repeat fixed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #ffffff;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
  }

  .heading {
    font-size: 22px;
    font-weight: 600;
  }

  #open-playlist {
    position: fixed;
    top: 16px;
    right: 16px;
    background: rgba(20, 20, 20, 0.55);
    backdrop-filter: blur(10px);
    color: #ffffff;
    text-decoration: none;
    border: 1px solid rgba(255, 255, 255, 0.4);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 12px;
    text-shadow: none;
  }

  #open-playlist:hover { border-color: #1db954; color: #1db954; }

  /* ---- bottom-docked mini player ---- */
  #player-view {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 560px;
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(135deg, rgba(60, 20, 15, 0.75), rgba(20, 10, 10, 0.75));
    backdrop-filter: blur(16px);
    border-radius: 999px;
    padding: 8px 14px 8px 8px;
  }

  .art {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
    background: #1a1a1a;
    flex-shrink: 0;
  }

  .track-info {
    flex: 1;
    min-width: 0;
    text-align: left;
  }

  .track-name {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    text-shadow: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-artist {
    font-size: 12px;
    color: #d8d8d8;
    opacity: 0.85;
    text-shadow: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 6px;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #time-label {
    font-size: 10px;
    color: #d8d8d8;
    text-shadow: none;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
  }

  .controls button {
    background: none;
    border: none;
    color: #ffffff;
    cursor: pointer;
    padding: 4px;
    text-shadow: none;
  }

  #prev-btn svg, #next-btn svg { width: 20px; height: 20px; fill: currentColor; }

  #play-pause {
    background: #fff;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 2px;
  }
  #play-pause svg { width: 20px; height: 20px; fill: #1a1a1a; }

  .progress-bar {
    flex: 1;
    height: 3px;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: #fff;
  }

  #up-next, #status {
    font-size: 10px;
    color: #ffffff;
    opacity: 0.7;
    margin-top: 6px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #embed-wrapper {
    position: fixed;
    top: 0;
    left: 0;
    width: 300px;
    height: 152px;
    opacity: 0;
    pointer-events: none;
    z-index: -1;
  }
</style>
</head>
<body>

  <a id="open-playlist" href="https://open.spotify.com/playlist/0UT7EGipZpUqJfc81YHROT" target="_blank" rel="noopener">Open in Spotify</a>

  <div class="heading">ಕನ್ನಡವೇ ಒಂದು ಭಾವನೆ</div>

  <div id="player-view">
    <div class="bar">
      <img id="art" class="art" alt="Album art">

      <div class="track-info">
        <div id="track-name" class="track-name">—</div>
        <div id="track-artist" class="track-artist">—</div>
        <div class="progress-row">
          <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
          <span id="time-label">0:00 / 0:00</span>
        </div>
      </div>

      <div class="controls">
        <button id="prev-btn" title="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="play-pause" title="Play">
          <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="next-btn" title="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-9.5 6L15 18V6z"/></svg>
        </button>
      </div>
    </div>

    <div id="up-next">Up next: <span id="up-next-name">—</span></div>
    <div id="status">Loading playlist...</div>
  </div>

  <div id="embed-wrapper"><div id="embed-host"></div></div>

  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
  <script src="app.js"></script>
</body>
</html>
